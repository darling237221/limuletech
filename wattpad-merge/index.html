<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>StoryHub — Merge Preview</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="js/app.js" type="module"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">StoryHub</div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-toggle" aria-label="Basculer thème">🌓</button>
            <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Ouvrir le menu">☰</button>
        </div>
    </nav>

    <main class="main-content">
        <section class="hero">
            <div class="hero-left">
                <h1>Découvrez des histoires <span class="gradient">incroyables</span></h1>
                <p>Fusion démo — intégration des animations 2D & 3D dans le projet existant.</p>
                <div class="hero-cta">
                    <button class="btn primary">Commencer</button>
                    <button class="btn outline">Écrire</button>
                </div>
            </div>
            <div class="hero-right">
                <!-- 2D floating books -->
                <div class="floating-books">
                    <div class="book book-1" style="--rotation:-12deg"></div>
                    <div class="book book-2" style="--rotation:6deg"></div>
                    <div class="book book-3" style="--rotation:10deg"></div>
                </div>

                <!-- 3D cube decorative element -->
                <div class="cube-wrap">
                    <div class="cube" aria-hidden="true">
                        <div class="face f1"></div>
                        <div class="face f2"></div>
                        <div class="face f3"></div>
                        <div class="face f4"></div>
                        <div class="face f5"></div>
                        <div class="face f6"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="features">
            <h2>Fonctionnalités</h2>
            <div class="cards">
                <div class="card">Router SPA</div>
                <div class="card">Thèmes & préférences</div>
                <div class="card">Animations 2D & 3D</div>
            </div>
        </section>
    </main>

    <footer class="footer">© 2025 LimuleTech · Merge Demo</footer>
</body>
</html>
